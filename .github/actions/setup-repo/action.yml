name: Setup repo
description: Install repository toolchains and materialize an upstream profile

inputs:
  profile:
    description: Upstream profile to materialize
    required: false
    default: next
  materialize:
    description: Whether to materialize the selected upstream profile
    required: false
    default: "true"
  rust-target:
    description: Rust target to install for Oxlint builds
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Rust
      if: inputs.profile == 'oxlint'
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: "1.93.0"
        components: rustfmt

    - name: Install native build tools
      if: inputs.profile == 'oxlint' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes cmake

    - name: Configure Rust build cache
      if: inputs.profile == 'oxlint'
      shell: bash
      run: echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/oxlint-target" >> "$GITHUB_ENV"

    - name: Cache Rust build
      if: inputs.profile == 'oxlint' && github.ref == 'refs/heads/main'
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/git
          ~/.cargo/registry
          ${{ runner.temp }}/oxlint-target
        key: rust-build-oxlint-1.93.0-${{ runner.os }}-${{ runner.arch }}-${{ inputs.rust-target || 'host' }}-${{ hashFiles('_packages/tsgo/upstream.json', '_patches/oxlint/**') }}
        restore-keys: |
          rust-build-oxlint-1.93.0-${{ runner.os }}-${{ runner.arch }}-${{ inputs.rust-target || 'host' }}-

    - name: Restore Rust build cache
      if: inputs.profile == 'oxlint' && github.ref != 'refs/heads/main'
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cargo/git
          ~/.cargo/registry
          ${{ runner.temp }}/oxlint-target
        key: rust-build-oxlint-1.93.0-${{ runner.os }}-${{ runner.arch }}-${{ inputs.rust-target || 'host' }}-${{ hashFiles('_packages/tsgo/upstream.json', '_patches/oxlint/**') }}
        restore-keys: |
          rust-build-oxlint-1.93.0-${{ runner.os }}-${{ runner.arch }}-${{ inputs.rust-target || 'host' }}-

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: "1.26"
        cache: false

    - name: Resolve Go cache paths
      id: go-cache
      shell: bash
      run: |
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

    - name: Cache Go modules
      if: github.ref == 'refs/heads/main'
      uses: actions/cache@v6
      with:
        path: ${{ steps.go-cache.outputs.modules }}/cache/download
        key: go-modules-1.26-${{ inputs.profile }}-${{ runner.os }}-${{ hashFiles('**/go.mod', '**/go.sum', '_packages/tsgo/upstream.json', '_patches/**/*.patch') }}

    - name: Restore Go modules
      if: github.ref != 'refs/heads/main'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.go-cache.outputs.modules }}/cache/download
        key: go-modules-1.26-${{ inputs.profile }}-${{ runner.os }}-${{ hashFiles('**/go.mod', '**/go.sum', '_packages/tsgo/upstream.json', '_patches/**/*.patch') }}

    - name: Cache Go build
      if: runner.os == 'Linux' && github.ref == 'refs/heads/main'
      uses: actions/cache@v6
      with:
        path: ${{ steps.go-cache.outputs.build }}
        key: go-build-${{ inputs.profile }}-Linux-${{ hashFiles('**/go.mod', '**/go.sum', '_packages/tsgo/upstream.json', '_patches/**/*.patch') }}-${{ github.sha }}
        restore-keys: |
          go-build-${{ inputs.profile }}-Linux-${{ hashFiles('**/go.mod', '**/go.sum', '_packages/tsgo/upstream.json', '_patches/**/*.patch') }}-
          go-build-${{ inputs.profile }}-Linux-

    - name: Restore Go build cache
      if: runner.os == 'Linux' && github.ref != 'refs/heads/main'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.go-cache.outputs.build }}
        key: go-build-${{ inputs.profile }}-Linux-${{ hashFiles('**/go.mod', '**/go.sum', '_packages/tsgo/upstream.json', '_patches/**/*.patch') }}-${{ github.sha }}
        restore-keys: |
          go-build-${{ inputs.profile }}-Linux-${{ hashFiles('**/go.mod', '**/go.sum', '_packages/tsgo/upstream.json', '_patches/**/*.patch') }}-
          go-build-${{ inputs.profile }}-Linux-

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: "24"

    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Materialize ${{ inputs.profile }} profile
      if: inputs.materialize == 'true'
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
      run: pnpm exec repoctl submodules setup --profile "$PROFILE"

    - name: Install Oxlint Rust target
      if: inputs.profile == 'oxlint' && inputs.materialize == 'true' && inputs.rust-target != ''
      shell: bash
      working-directory: oxlint
      env:
        RUST_TARGET: ${{ inputs.rust-target }}
      run: rustup target add "$RUST_TARGET"
