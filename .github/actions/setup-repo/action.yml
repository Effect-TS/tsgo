name: Setup repo
description: Install repository toolchains and materialize an upstream component

inputs:
  profile:
    description: Compatibility profile selector; prefer component and version
    required: false
    default: ""
  component:
    description: Upstream component to materialize
    required: false
    default: typescript
  version:
    description: Component version; TypeScript defaults to the configured next version
    required: false
    default: ""
  materialize:
    description: Whether to materialize the selected upstream component
    required: false
    default: "true"
  rust-target:
    description: Rust target to install for Oxlint builds
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Resolve upstream component
      id: upstream-component
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
        PROFILE: ${{ inputs.profile }}
        RUST_TARGET: ${{ inputs.rust-target }}
        VERSION: ${{ inputs.version }}
      run: |
        node --input-type=module -e '
          import { appendFileSync, readFileSync } from "node:fs";
          const upstream = JSON.parse(readFileSync("_packages/tsgo/upstream.json", "utf8"));
          let component = process.env.COMPONENT;
          let version = process.env.VERSION;
          const profileName = process.env.PROFILE;
          if (profileName === "next" || profileName === "latest") {
            component = "typescript";
            version = upstream.typescript[profileName];
          } else if (profileName === "oxlint") {
            component = process.env.RUST_TARGET === "" ? "oxlint-tsgolint" : "oxlint";
            const profile = upstream.profiles.find((candidate) => candidate.name === profileName);
            version = profile?.dependencies?.[component];
          } else if (profileName !== "") {
            throw new Error(`Unknown compatibility profile: ${profileName}`);
          }
          if (version === "" && component === "typescript") version = upstream.typescript.next;
          if (typeof version !== "string" || version === "") {
            throw new Error(`A version is required for component ${component}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `component=${component}\nversion=${version}\n`);
        '

    - name: Setup Rust
      if: steps.upstream-component.outputs.component == 'oxlint'
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: "1.93.0"
        components: rustfmt

    - name: Install native build tools
      if: steps.upstream-component.outputs.component == 'oxlint' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes cmake

    - name: Configure Rust build cache
      if: steps.upstream-component.outputs.component == 'oxlint'
      shell: bash
      run: echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/oxlint-target" >> "$GITHUB_ENV"

    - name: Cache Rust build
      if: steps.upstream-component.outputs.component == 'oxlint' && github.ref == 'refs/heads/main'
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/git
          ~/.cargo/registry
          ${{ runner.temp }}/oxlint-target
        key: rust-build-oxlint-1.93.0-${{ runner.os }}-${{ runner.arch }}-${{ inputs.rust-target || 'host' }}-${{ hashFiles('_packages/tsgo/upstream.json', '_patches/oxlint/**') }}
        restore-keys: |
          rust-build-oxlint-1.93.0-${{ runner.os }}-${{ runner.arch }}-${{ inputs.rust-target || 'host' }}-

    - name: Restore Rust build cache
      if: steps.upstream-component.outputs.component == 'oxlint' && github.ref != 'refs/heads/main'
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cargo/git
          ~/.cargo/registry
          ${{ runner.temp }}/oxlint-target
        key: rust-build-oxlint-1.93.0-${{ runner.os }}-${{ runner.arch }}-${{ inputs.rust-target || 'host' }}-${{ hashFiles('_packages/tsgo/upstream.json', '_patches/oxlint/**') }}
        restore-keys: |
          rust-build-oxlint-1.93.0-${{ runner.os }}-${{ runner.arch }}-${{ inputs.rust-target || 'host' }}-

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: "1.26"
        cache: false

    - name: Resolve Go cache paths
      id: go-cache
      shell: bash
      run: |
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

    - name: Cache Go modules
      if: github.ref == 'refs/heads/main'
      uses: actions/cache@v6
      with:
        path: ${{ steps.go-cache.outputs.modules }}/cache/download
        key: go-modules-1.26-${{ steps.upstream-component.outputs.component }}-${{ steps.upstream-component.outputs.version }}-${{ runner.os }}-${{ hashFiles('**/go.mod', '**/go.sum', '_packages/tsgo/upstream.json', '_patches/**/*.patch') }}

    - name: Restore Go modules
      if: github.ref != 'refs/heads/main'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.go-cache.outputs.modules }}/cache/download
        key: go-modules-1.26-${{ steps.upstream-component.outputs.component }}-${{ steps.upstream-component.outputs.version }}-${{ runner.os }}-${{ hashFiles('**/go.mod', '**/go.sum', '_packages/tsgo/upstream.json', '_patches/**/*.patch') }}

    - name: Cache Go build
      if: runner.os == 'Linux' && github.ref == 'refs/heads/main'
      uses: actions/cache@v6
      with:
        path: ${{ steps.go-cache.outputs.build }}
        key: go-build-${{ steps.upstream-component.outputs.component }}-${{ steps.upstream-component.outputs.version }}-Linux-${{ hashFiles('**/go.mod', '**/go.sum', '_packages/tsgo/upstream.json', '_patches/**/*.patch') }}-${{ github.sha }}
        restore-keys: |
          go-build-${{ steps.upstream-component.outputs.component }}-${{ steps.upstream-component.outputs.version }}-Linux-${{ hashFiles('**/go.mod', '**/go.sum', '_packages/tsgo/upstream.json', '_patches/**/*.patch') }}-
          go-build-${{ steps.upstream-component.outputs.component }}-${{ steps.upstream-component.outputs.version }}-Linux-

    - name: Restore Go build cache
      if: runner.os == 'Linux' && github.ref != 'refs/heads/main'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.go-cache.outputs.build }}
        key: go-build-${{ steps.upstream-component.outputs.component }}-${{ steps.upstream-component.outputs.version }}-Linux-${{ hashFiles('**/go.mod', '**/go.sum', '_packages/tsgo/upstream.json', '_patches/**/*.patch') }}-${{ github.sha }}
        restore-keys: |
          go-build-${{ steps.upstream-component.outputs.component }}-${{ steps.upstream-component.outputs.version }}-Linux-${{ hashFiles('**/go.mod', '**/go.sum', '_packages/tsgo/upstream.json', '_patches/**/*.patch') }}-
          go-build-${{ steps.upstream-component.outputs.component }}-${{ steps.upstream-component.outputs.version }}-Linux-

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: "24"

    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Materialize upstream component
      if: inputs.materialize == 'true'
      shell: bash
      env:
        COMPONENT: ${{ steps.upstream-component.outputs.component }}
        VERSION: ${{ steps.upstream-component.outputs.version }}
      run: pnpm exec repoctl submodules setup --component "$COMPONENT" --version "$VERSION"

    - name: Install Oxlint Rust target
      if: steps.upstream-component.outputs.component == 'oxlint' && inputs.materialize == 'true' && inputs.rust-target != ''
      shell: bash
      working-directory: oxlint
      env:
        RUST_TARGET: ${{ inputs.rust-target }}
      run: rustup target add "$RUST_TARGET"
