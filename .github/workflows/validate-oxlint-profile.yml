name: Validate Oxlint Profile

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: validate-oxlint-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    name: Validate Oxlint profile
    if: github.repository_owner == 'Effect-TS'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup oxlint-tsgolint component
        uses: ./.github/actions/setup-repo
        with:
          profile: oxlint

      - name: Build tsgolint
        run: pnpm exec repoctl build tsgolint --target linux-x64

      - name: Setup Oxlint component
        uses: ./.github/actions/setup-repo
        with:
          profile: oxlint
          rust-target: x86_64-unknown-linux-gnu

      - name: Build Oxlint binding
        run: pnpm exec repoctl build oxlint-binding --target linux-x64

      - name: Smoke test Oxlint profile
        run: node testdata/tests/oxlint/smoke.mjs "$GITHUB_WORKSPACE"
