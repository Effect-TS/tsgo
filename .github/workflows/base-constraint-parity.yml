name: Base constraint Go and Effect Rust parity

on:
  push:
    branches: [fix/indexed-base-constraint-identity]

permissions:
  contents: read

concurrency:
  group: constraint-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    if: github.repository == 'BleedingDev/tsgo'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Materialize the official paired component and patch stacks
        uses: ./.github/actions/setup-repo
        with:
          component: tsrs
      - name: Check port bookkeeping
        run: pnpm exec repoctl tsrs port-check
      - name: Pinned Go nineteen-case history regression
        id: go
        continue-on-error: true
        run: go test ./typescript/tsc/internal/compiler -run '^TestBaseConstraintHistory$' -count=1 -timeout=2m -v
      - name: Format the new Rust regression remotely
        run: rustfmt --edition 2024 crates/ets_typeparser/tests/base_constraint_history.rs
      - name: Matching Rust nineteen-case history regression
        id: rust
        continue-on-error: true
        run: cargo test --locked -p ets_typeparser --test base_constraint_history -- --nocapture
      - name: Official Rust lint
        id: lint
        continue-on-error: true
        run: pnpm exec repoctl tsrs lint
      - name: Official Rust checks
        id: check
        continue-on-error: true
        run: pnpm exec repoctl tsrs check
      - name: Official Rust tests and Effect-enabled binary smoke
        id: tests
        continue-on-error: true
        run: pnpm exec repoctl tsrs test
      - name: Retain the generated formatting and paired binary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: constraint-parity-${{ github.sha }}
          path: |
            crates/ets_typeparser/tests/base_constraint_history.rs
            target/debug/tsrs
          if-no-files-found: error
          retention-days: 14
      - name: Require every executed lane and committed formatting
        if: always()
        env:
          GO: ${{ steps.go.outcome }}
          RUST: ${{ steps.rust.outcome }}
          LINT: ${{ steps.lint.outcome }}
          CHECK: ${{ steps.check.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          for result in "$GO" "$RUST" "$LINT" "$CHECK" "$TESTS"; do test "$result" = success; done
          git diff --exit-code -- crates/ets_typeparser/tests/base_constraint_history.rs
