name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  matrix:
    name: Plan TypeScript validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      typescript: ${{ steps.matrix.outputs.typescript }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate TypeScript test matrix
        id: matrix
        run: echo "typescript=$(pnpm --silent exec repoctl matrix typescript test)" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate TypeScript ${{ matrix.name }} (${{ matrix.version }})
    needs: matrix
    if: github.repository_owner == 'Effect-TS'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.typescript) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup TypeScript ${{ matrix.version }}
        uses: ./.github/actions/setup-repo
        with:
          component: typescript
          version: ${{ matrix.version }}

      - name: Build
        run: pnpm exec repoctl build local

      - name: Validate repoctl
        if: matrix.repoctl
        run: pnpm run check:repoctl && pnpm run test:repoctl

      - name: Test
        run: pnpm exec repoctl test
