name: Update Upstreams

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: update-upstreams-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  update:
    name: Update upstream metadata
    if: github.repository_owner == 'Effect-TS'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      checks: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup repository tools
        uses: ./.github/actions/setup-repo
        with:
          materialize: "false"

      - name: Update upstream metadata
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec repoctl upstream update

      - name: Open metadata update pull request
        id: generated
        if: steps.upstream.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ steps.upstream.outputs.description }}
        run: |
          pnpm exec repoctl github open-pr-if-changed \
            --base main \
            --head update-upstreams \
            --title 'chore: update upstreams' \
            --body "$PR_BODY" \
            --commit-message 'chore: update upstream metadata' \
            --check generation_check_id='Generate TypeScript next tag'

      # The tsrs setup checks out and patches the TypeScript tsrs ports and tsrs and regenerates the Go shims and crates/ets_shim.
      # A patch that no longer applies (e.g. _patches/tsrs after a tsrs bump) sets the patch_failure output, reported
      # on the pull request below.
      - name: Setup TypeScript next tag and tsrs
        id: setup
        if: steps.upstream.outputs.has_changes == 'true'
        run: pnpm exec repoctl submodules setup --component tsrs

      # Back to the default (Go-only) setup, which drops the tsrs checkout, so the generated tree commits no tsrs
      # submodule; the regenerated crates/ets_shim stays. The pull request's Validate tsrs run builds and tests Rust.
      - name: Setup TypeScript next tag
        if: steps.upstream.outputs.has_changes == 'true'
        run: pnpm exec repoctl submodules setup

      - name: Report broken patch on the pull request
        if: failure() && steps.setup.outputs.patch_failure != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ steps.upstream.outputs.description }}
          PATCH_FAILURE: ${{ steps.setup.outputs.patch_failure }}
        run: gh pr edit update-upstreams --body "$PR_BODY"$'\n\n'"$PATCH_FAILURE"

      - name: Regenerate tsconfig schema
        if: steps.upstream.outputs.schema_changed == 'true'
        run: UPDATE_TSCONFIG_SCHEMA=1 go test ./etscore -run '^TestGenerateTSConfigSchemaMatchesReference$'

      - name: Regenerate Oxlint configuration schema
        if: steps.upstream.outputs.oxlint_schema_changed == 'true'
        run: UPDATE_OXLINT_SCHEMA=1 go test ./etscore -run '^TestGenerateOxlintSchemaMatchesReference$'

      - name: Install Nix
        if: steps.upstream.outputs.has_changes == 'true'
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Setup Nix cache
        if: steps.upstream.outputs.has_changes == 'true'
        uses: DeterminateSystems/flakehub-cache-action@e62e272c914d4ad8e4d1587a864e9c3ad2cba9de

      - name: Update Nix flake
        if: steps.upstream.outputs.has_changes == 'true'
        run: pnpm exec repoctl flake update

      - name: Write changeset
        if: steps.upstream.outputs.has_changes == 'true'
        run: |
          pnpm exec repoctl changeset add \
            --id update-upstreams \
            'Update the TypeScript next tag to [`${{ steps.upstream.outputs.next_spec }}`](https://www.npmjs.com/package/typescript/v/${{ steps.upstream.outputs.next_version }}), which ships [`typescript-go`](https://github.com/microsoft/typescript-go/commit/${{ steps.upstream.outputs.next_git_head }}) commit `${{ steps.upstream.outputs.next_git_head }}`, update the TypeScript beta tag to [`${{ steps.upstream.outputs.beta_spec }}`](https://www.npmjs.com/package/typescript/v/${{ steps.upstream.outputs.beta_version }}), and update the TypeScript latest tag to [`${{ steps.upstream.outputs.latest_spec }}`](https://www.npmjs.com/package/typescript/v/${{ steps.upstream.outputs.latest_version }}).${{ steps.upstream.outputs.schema_changed == 'true' && ' Refresh the tsconfig schema from JSON Schema Store.' || '' }}${{ steps.upstream.outputs.oxlint_schema_changed == 'true' && ' Refresh the Oxlint configuration schema from the selected package.' || '' }}'

      - name: Update pull request with TypeScript next tag
        id: generated-tag
        if: steps.upstream.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ steps.upstream.outputs.description }}
        run: |
          pnpm exec repoctl github open-pr-if-changed \
            --base main \
            --head update-upstreams \
            --title 'chore: update upstreams' \
            --body "$PR_BODY" \
            --commit-message 'chore: generate TypeScript next tag' \
            --check validation_check_id='Validate TypeScript next tag'

      - name: Publish generation result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATCH_FAILURE: ${{ steps.setup.outputs.patch_failure }}
          PATCH_FAILURE_FILE: ${{ steps.setup.outputs.patch_failure_file }}
        run: |
          failure_message='TypeScript next-tag generation failed'
          if [ -n "$PATCH_FAILURE_FILE" ]; then
            failure_message="$PATCH_FAILURE_FILE no longer applies"
          fi
          pnpm exec repoctl github complete-check \
            --check-id '${{ steps.generated.outputs.generation_check_id }}' \
            --result '${{ job.status }}' \
            --success-message 'TypeScript next tag generated' \
            --failure-message "$failure_message" \
            --summary "${PATCH_FAILURE:-See the workflow run for upstream setup and Nix output.}"

      - name: Build TypeScript next tag
        if: steps.upstream.outputs.has_changes == 'true'
        run: pnpm exec repoctl build local

      - name: Test TypeScript next tag
        if: steps.upstream.outputs.has_changes == 'true'
        run: pnpm exec repoctl test

      - name: Publish TypeScript next-tag validation result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm exec repoctl github complete-check \
            --check-id '${{ steps.generated-tag.outputs.validation_check_id }}' \
            --result '${{ job.status }}' \
            --success-message 'TypeScript next-tag validation passed' \
            --failure-message 'TypeScript next-tag validation failed' \
            --summary 'See the workflow run for setup, build, and test output.'
