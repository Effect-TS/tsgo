name: Validate Oxlint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: validate-oxlint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  matrix:
    uses: ./.github/workflows/repoctl-matrix.yml
    permissions:
      contents: read
    with:
      name: oxlint-build

  # Each Oxlint binding, tsgolint and tsrs version of _packages/tsgo/upstream.json, built once for linux-x64
  # (`repoctl matrix oxlint-build`; tsrs without the release's PGO and BOLT).
  build:
    name: Build ${{ matrix.name }}
    needs: matrix
    if: github.repository_owner == 'Effect-TS'
    runs-on: ubuntu-latest
    # A cold release build of tsrs or of an Oxlint binding.
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup ${{ matrix.component }} ${{ matrix.version }}
        uses: ./.github/actions/setup-repo
        with:
          component: ${{ matrix.component }}
          version: ${{ matrix.version }}
          target: ${{ matrix.target }}

      - name: Build Oxlint binding
        if: matrix.component == 'oxlint'
        id: build-oxlint
        env:
          TARGET_CC: clang
        run: >
          pnpm exec repoctl build artifact
          --component oxlint
          --version "${{ matrix.version }}"
          --target "${{ matrix.target }}"

      - name: Build ${{ matrix.component }}
        if: matrix.component != 'oxlint'
        id: build
        run: >
          pnpm exec repoctl build artifact
          --component "${{ matrix.component }}"
          --version "${{ matrix.version }}"
          --target "${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifactName }}
          path: ${{ steps.build-oxlint.outputs.artifact_path || steps.build.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 1

  # Every supported runtime (each profile of upstream.json, and each tsrs version) through the effect-tsgo proxy
  # commands, on a project per runtime with its exact npm packages installed: `repoctl oxlint verify`.
  verify:
    name: Verify the Oxlint integration
    needs: build
    if: github.repository_owner == 'Effect-TS'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "linux-x64__*"
          path: _oxlint-artifacts

      - name: Assemble the linux-x64 platform package
        run: pnpm exec repoctl packages assemble --artifacts _oxlint-artifacts --plan oxlint

      - name: Build @effect/tsgo package
        run: pnpm --filter @effect/tsgo build

      - name: Verify every Oxlint runtime
        run: pnpm exec repoctl oxlint verify --summary "$GITHUB_STEP_SUMMARY"
