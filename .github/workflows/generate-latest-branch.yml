name: Generate Latest Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: generate-latest-branch
  cancel-in-progress: true

permissions: {}

jobs:
  generate:
    name: Generate generated/latest
    if: github.repository_owner == 'Effect-TS'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
      base_sha: ${{ steps.changes.outputs.base_sha }}
      candidate_ref: ${{ steps.changes.outputs.candidate_ref }}
      head_sha: ${{ steps.changes.outputs.head_sha }}
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          submodules: recursive

      - name: Track TypeScript-Go submodule updates in Git
        run: git config submodule.typescript-go.ignore dirty

      - name: Setup stable repo
        uses: ./.github/actions/setup-repo
        with:
          profile: stable

      - name: Read stable TypeScript metadata
        id: typescript
        run: |
          echo "version=$(node _tools/upstream.mjs field stable tsVersion)" >> "$GITHUB_OUTPUT"
          echo "git_head=$(node _tools/upstream.mjs field stable tsGitHead)" >> "$GITHUB_OUTPUT"

      - name: Create generated latest commit
        id: changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth 1 origin generated/latest

          git add -A
          generated_tree="$(git write-tree)"
          latest_tree="$(git rev-parse FETCH_HEAD^{tree})"
          base_sha="$(git rev-parse FETCH_HEAD)"
          echo "base_sha=${base_sha}" >> "$GITHUB_OUTPUT"

          if [ "${generated_tree}" = "${latest_tree}" ]; then
            echo "Generated latest branch is already up to date."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          head_sha="$(git commit-tree "${generated_tree}" \
            -p FETCH_HEAD \
            -m "chore: generate latest TypeScript-Go branch" \
            -m "TypeScript package: typescript@latest" \
            -m "TypeScript version: ${{ steps.typescript.outputs.version }}" \
            -m "TypeScript-Go commit: ${{ steps.typescript.outputs.git_head }}")"
          candidate_ref="automation/generated-latest-candidate/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "candidate_ref=${candidate_ref}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"

      - name: Push generated latest candidate
        if: steps.changes.outputs.has_changes == 'true'
        env:
          CANDIDATE_REF: ${{ steps.changes.outputs.candidate_ref }}
          HEAD_SHA: ${{ steps.changes.outputs.head_sha }}
        run: |
          git push origin "${HEAD_SHA}:refs/heads/${CANDIDATE_REF}"

  validate:
    name: Validate generated latest candidate
    needs: generate
    if: needs.generate.outputs.has_changes == 'true' && needs.generate.outputs.head_sha != ''
    permissions:
      contents: read
    uses: ./.github/workflows/validate-profile.yml
    with:
      head_sha: ${{ needs.generate.outputs.head_sha }}
      profile: stable
      require_clean: true
    secrets: inherit

  promote:
    name: Promote generated/latest
    needs: [generate, validate]
    if: needs.generate.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
      contents: write
    steps:
      - name: Checkout generated/latest
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: generated/latest
          fetch-depth: 1

      - name: Fast-forward generated/latest
        env:
          BASE_SHA: ${{ needs.generate.outputs.base_sha }}
          CANDIDATE_REF: ${{ needs.generate.outputs.candidate_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ needs.generate.outputs.head_sha }}
        run: |
          current_sha="$(git rev-parse HEAD)"
          if [ "${current_sha}" != "${BASE_SHA}" ]; then
            echo "generated/latest moved from ${BASE_SHA} to ${current_sha}; refusing to overwrite it" >&2
            exit 1
          fi

          git fetch --depth 1 origin "refs/heads/${CANDIDATE_REF}:refs/remotes/origin/generated-latest-candidate"
          candidate_sha="$(git rev-parse refs/remotes/origin/generated-latest-candidate)"
          if [ "${candidate_sha}" != "${HEAD_SHA}" ]; then
            echo "candidate ref points to ${candidate_sha}, expected ${HEAD_SHA}" >&2
            exit 1
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name='Generated profile validation' \
            -f head_sha="${HEAD_SHA}" \
            -f status=completed \
            -f conclusion=success \
            -f 'output[title]=Stable profile validation passed' \
            -f 'output[summary]=The exact generated candidate passed check, build, test, and lint.'

          git push origin "${HEAD_SHA}:refs/heads/generated/latest"

  cleanup:
    name: Delete generated latest candidate
    needs: [generate, validate, promote]
    if: always() && needs.generate.outputs.has_changes == 'true' && needs.generate.outputs.candidate_ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 1

      - name: Delete candidate ref
        env:
          CANDIDATE_REF: ${{ needs.generate.outputs.candidate_ref }}
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/${CANDIDATE_REF}" >/dev/null 2>&1; then
            git push origin --delete "${CANDIDATE_REF}"
          fi
