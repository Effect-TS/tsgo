name: Perf

on:
  pull_request:
    # Opt-in: runs only while the PR carries the perf label (see the matrix job's if).
    # closed, converted_to_draft and removing the label join the PR's concurrency group so they cancel the in-progress run.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, converted_to_draft, closed]
    branches:
      - main
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - go.work
      - go.work.sum
      - "_patches/**"
      - _packages/tsgo/upstream.json
      - "_tools/repoctl/src/perf*.ts"
      - _tools/repoctl/src/matrix.ts
      - .github/workflows/perf.yml

# Adding or removing any other label gets a group of its own, so it does not cancel an in-progress run.
concurrency:
  group: perf-${{ github.ref }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'perf' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions: {}

jobs:
  matrix:
    name: Generate perf matrix
    if: >-
      github.event.action != 'closed' && github.event.action != 'unlabeled' && !github.event.pull_request.draft
      && contains(github.event.pull_request.labels.*.name, 'perf')
      && (github.event.action != 'labeled' || github.event.label.name == 'perf')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate matrix
        id: matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: echo "matrix=$(pnpm --silent exec repoctl matrix perf --base-ref "$BASE_SHA" --head-ref "$HEAD_SHA")" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }} ${{ matrix.side }} (${{ matrix.version }})
    needs: matrix
    if: github.repository_owner == 'Effect-TS'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix).build }}

    steps:
      - name: Checkout ${{ matrix.side }}
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false

      # Uses the subject commit's own setup action and repoctl so the base is built with base tooling.
      - name: Setup typescript ${{ matrix.version }}
        uses: ./.github/actions/setup-repo
        with:
          component: typescript
          version: ${{ matrix.version }}

      - name: Build patched compiler
        run: |
          pnpm exec repoctl build local
          mkdir -p "$RUNNER_TEMP/tsgo-build"
          cp ./tsgo "$RUNNER_TEMP/tsgo-build/tsgo"

      # Artifacts drop the executable bit; the measure job restores it.
      - name: Upload patched compiler
        uses: actions/upload-artifact@v7
        with:
          name: tsgo-${{ matrix.name }}-${{ matrix.side }}
          path: ${{ runner.temp }}/tsgo-build/tsgo
          if-no-files-found: error
          retention-days: 1

  # One runner per channel times stock, base, and head in rotated order each round, so the head vs base
  # comparison does not depend on two runners' hardware.
  measure:
    name: Measure ${{ matrix.name }}
    needs: [matrix, build]
    # A failed build fails only its own channel's download below.
    if: always() && github.repository_owner == 'Effect-TS' && needs.matrix.result == 'success' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix).measure }}

    steps:
      # The perf ci command only exists in the head tooling.
      - name: Checkout head tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download base compiler
        if: matrix.base
        uses: actions/download-artifact@v8
        with:
          name: tsgo-${{ matrix.name }}-base
          path: ${{ runner.temp }}/tsgo-base

      - name: Download head compiler
        if: matrix.head
        uses: actions/download-artifact@v8
        with:
          name: tsgo-${{ matrix.name }}-head
          path: ${{ runner.temp }}/tsgo-head

      - name: Measure
        env:
          CHANNEL: ${{ matrix.name }}
          BASE_COMMIT: ${{ matrix.base.ref }}
          BASE_VERSION: ${{ matrix.base.version }}
          HEAD_COMMIT: ${{ matrix.head.ref }}
          HEAD_VERSION: ${{ matrix.head.version }}
        run: |
          args=(
            perf ci
            --channel "$CHANNEL"
            --workload-dir "$RUNNER_TEMP/effect-workload"
            --output "$RUNNER_TEMP/perf/$CHANNEL.json"
          )
          for side in base head; do
            commit_var="${side^^}_COMMIT"
            version_var="${side^^}_VERSION"
            if [ -n "${!commit_var}" ]; then
              chmod +x "$RUNNER_TEMP/tsgo-$side/tsgo"
              args+=(
                "--$side-bin" "$RUNNER_TEMP/tsgo-$side/tsgo"
                "--$side-commit" "${!commit_var}"
                "--$side-version" "${!version_var}"
              )
            fi
          done
          pnpm exec repoctl "${args[@]}"

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-${{ matrix.name }}
          path: ${{ runner.temp }}/perf
          if-no-files-found: ignore
          retention-days: 14

  report:
    name: Perf report
    needs: [matrix, measure]
    if: always() && github.repository_owner == 'Effect-TS' && needs.matrix.result == 'success' && needs.measure.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Missing cells are reported from the matrix, so a failed download must not block the report.
      - name: Download perf results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: perf-*
          path: ${{ runner.temp }}/perf-results
          merge-multiple: true

      - name: Render report
        env:
          MATRIX: ${{ needs.matrix.outputs.matrix }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/perf-results" "$RUNNER_TEMP/perf-report"
          printf '%s' "$MATRIX" > "$RUNNER_TEMP/perf-matrix.json"
          pnpm exec repoctl perf report \
            --input "$RUNNER_TEMP/perf-results" \
            --matrix "$RUNNER_TEMP/perf-matrix.json" \
            --output "$RUNNER_TEMP/perf-report/report.md"
          cat "$RUNNER_TEMP/perf-report/report.md" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$PR_NUMBER" > "$RUNNER_TEMP/perf-report/pr-number.txt"
          printf '%s\n' "$PR_HEAD_SHA" > "$RUNNER_TEMP/perf-report/head-sha.txt"

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: perf-report
          path: ${{ runner.temp }}/perf-report
          if-no-files-found: error
          retention-days: 14
