name: Update Generated Branches

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: update-generated-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  matrix:
    name: Plan generated branches
    if: github.repository_owner == 'Effect-TS'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      typescript: ${{ steps.matrix.outputs.typescript }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate TypeScript branch matrix
        id: matrix
        run: echo "typescript=$(pnpm --silent exec repoctl matrix typescript generated)" >> "$GITHUB_OUTPUT"

  update:
    name: Update ${{ matrix.branch }}
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      checks: write
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.typescript) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup TypeScript ${{ matrix.version }}
        uses: ./.github/actions/setup-repo
        with:
          component: typescript
          version: ${{ matrix.version }}

      - name: Open generated branch pull request
        id: generated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GENERATED_BRANCH: ${{ matrix.branch }}
        run: |
          pnpm exec repoctl github open-pr-if-changed \
            --base "$GENERATED_BRANCH" \
            --head-prefix automation/update-generated-latest \
            --title 'chore: update generated/latest' \
            --body 'Generated latest TypeScript component from main commit `${{ github.sha }}`.' \
            --commit-message 'chore: update generated/latest' \
            --check check_id='Generated TypeScript update'

      - name: Publish generated update result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm exec repoctl github complete-check \
            --check-id '${{ steps.generated.outputs.check_id }}' \
            --result '${{ job.status }}' \
            --success-message 'Generated TypeScript branch updated' \
            --failure-message 'Generated TypeScript branch update failed' \
            --summary 'See the workflow run for generated branch output.'
