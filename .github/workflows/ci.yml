name: CI

on:
  push:
    branches:
      - main
      - generated/latest
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profiles:
    name: Profile (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        profile:
          - next
          - stable
    permissions:
      contents: read
    uses: ./.github/workflows/validate-profile.yml
    with:
      head_sha: ${{ github.sha }}
      profile: ${{ matrix.profile }}
    secrets: inherit

  flake:
    name: Flake (${{ matrix.os }})
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Setup Nix cache
        uses: DeterminateSystems/flakehub-cache-action@main

      - name: Build flake package
        run: nix build .#effect-tsgo --no-write-lock-file
