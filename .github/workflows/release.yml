name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  select-mode:
    name: Select Mode
    if: github.repository_owner == 'Effect-TS'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select release mode
        id: select-mode
        uses: changesets/action/select-mode@c47fa68bd43bb8ae0bae7e558622593deebf5955 # v2.0.0-next.3

  version:
    name: Version Packages
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update release PR
        uses: changesets/action/version@c47fa68bd43bb8ae0bae7e558622593deebf5955 # v2.0.0-next.3
        with:
          github-token: ${{ github.token }}
          script: pnpm exec repoctl changeset version
          commit-mode: github-api

  build:
    name: Build ${{ matrix.profile }} ${{ matrix.npm_target }}
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: true
      matrix:
        npm_target:
          - darwin-arm64
          - darwin-x64
          - win32-x64
          - win32-arm64
          - linux-x64
          - linux-arm64
          - linux-arm
        profile:
          - next
          - latest
        os:
          - ubuntu-latest
        include:
          - profile: oxlint
            npm_target: darwin-arm64
            os: macos-latest
            rust_target: aarch64-apple-darwin
          - profile: oxlint
            npm_target: darwin-x64
            os: macos-latest
            rust_target: x86_64-apple-darwin
          - profile: oxlint
            npm_target: win32-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - profile: oxlint
            npm_target: win32-arm64
            os: windows-latest
            rust_target: aarch64-pc-windows-msvc
          - profile: oxlint
            npm_target: linux-x64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
          - profile: oxlint
            npm_target: linux-arm64
            os: ubuntu-latest
            rust_target: aarch64-unknown-linux-gnu
    steps:
      - name: Enable long Git paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Setup Rust
        if: matrix.profile == 'oxlint'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"
          components: rustfmt
          targets: ${{ matrix.rust_target }}

      - name: Setup ${{ matrix.profile }} repo
        uses: ./.github/actions/setup-repo
        with:
          profile: ${{ matrix.profile }}

      - name: Add Oxlint Rust target
        if: matrix.profile == 'oxlint'
        working-directory: oxlint
        run: rustup target add ${{ matrix.rust_target }}

      - name: Build tsc ${{ matrix.profile }} ${{ matrix.npm_target }}
        if: matrix.profile != 'oxlint'
        id: binary
        run: pnpm exec repoctl build binary --profile ${{ matrix.profile }} --target ${{ matrix.npm_target }}

      - name: Build oxlint ${{ matrix.npm_target }}
        if: matrix.profile == 'oxlint'
        id: oxlint
        env:
          TARGET_CC: clang
        run: pnpm exec repoctl build oxlint --target ${{ matrix.npm_target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.npm_target }}__${{ matrix.profile }}
          path: ${{ matrix.profile == 'oxlint' && steps.oxlint.outputs.artifact_path || steps.binary.outputs.binary_path }}
          if-no-files-found: error

  pack:
    name: Pack Packages
    needs: [select-mode, build]
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download platform binaries
        uses: actions/download-artifact@v8
        with:
          path: _release-artifacts

      - name: Copy binaries into platform packages
        run: |
          for artifact_dir in _release-artifacts/*__*; do
            artifact_name="${artifact_dir##*/}"
            npm_target="${artifact_name%%__*}"
            package_dir="_packages/tsgo-${npm_target}/lib"

            mkdir -p "${package_dir}"
            cp "${artifact_dir}"/* "${package_dir}/"
          done

          for tsgolint in _packages/tsgo-{darwin-*,linux-{x64,arm64}}/lib/tsgolint; do
            chmod 755 "${tsgolint}"
          done

      - name: Bundle upstream metadata
        run: pnpm exec repoctl packages bundle-upstream

      - name: Verify platform binaries
        run: pnpm exec repoctl build verify-release

      - name: Build CLI bundle
        run: pnpm exec repoctl build cli

      - name: Pack packages
        id: pack
        uses: changesets/action/pack@c47fa68bd43bb8ae0bae7e558622593deebf5955 # v2.0.0-next.3
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish Packages
    needs: [select-mode, pack]
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish packages and create releases
        id: publish
        uses: changesets/action/publish@c47fa68bd43bb8ae0bae7e558622593deebf5955 # v2.0.0-next.3
        with:
          github-token: ${{ github.token }}
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          push-git-tags: true
          create-github-releases: true
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Verify published packages
        env:
          PUBLISHED: ${{ steps.publish.outputs.published }}
          PUBLISHED_PACKAGES: ${{ steps.publish.outputs.published-packages }}
        run: |
          node <<'NODE'
          const expected = [
            "@effect/tsgo",
            "@effect/tsgo-darwin-arm64",
            "@effect/tsgo-darwin-x64",
            "@effect/tsgo-linux-arm",
            "@effect/tsgo-linux-arm64",
            "@effect/tsgo-linux-x64",
            "@effect/tsgo-win32-arm64",
            "@effect/tsgo-win32-x64"
          ]
          const published = JSON.parse(process.env.PUBLISHED_PACKAGES || "[]")
          const names = published.map(({ name }) => name)
          const versions = new Set(published.map(({ version }) => version))
          const packageVersion = require("./_packages/tsgo/package.json").version

          if (process.env.PUBLISHED !== "true") {
            throw new Error("Changesets did not report a publication")
          }
          if (names.length === 0 || new Set(names).size !== names.length || names.some((name) => !expected.includes(name))) {
            throw new Error(`Unexpected published packages: ${JSON.stringify(published)}`)
          }
          if (versions.size !== 1 || !versions.has(packageVersion)) {
            throw new Error(`Published packages have unexpected versions: ${JSON.stringify(published)}`)
          }
          NODE

          version=$(node -p "require('./_packages/tsgo/package.json').version")
          for package in \
            @effect/tsgo \
            @effect/tsgo-darwin-arm64 \
            @effect/tsgo-darwin-x64 \
            @effect/tsgo-linux-arm \
            @effect/tsgo-linux-arm64 \
            @effect/tsgo-linux-x64 \
            @effect/tsgo-win32-arm64 \
            @effect/tsgo-win32-x64; do
            published_version=""
            for _ in 1 2 3 4 5; do
              published_version=$(npm view "${package}@${version}" version 2>/dev/null) && break
              sleep 5
            done
            if [ "${published_version}" != "${version}" ]; then
              echo "Expected ${package}@${version} in npm, found ${published_version:-nothing}" >&2
              exit 1
            fi
            tag_result=$(git ls-remote --exit-code --tags \
              "https://github.com/${GITHUB_REPOSITORY}.git" \
              "refs/tags/${package}@${version}")
            tag_sha=${tag_result%%$'\t'*}
            if [ "${tag_sha}" != "${GITHUB_SHA}" ]; then
              echo "Expected ${package}@${version} to point to ${GITHUB_SHA}, found ${tag_sha}" >&2
              exit 1
            fi
          done
