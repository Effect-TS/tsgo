name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'changeset-release/main' &&
      github.repository_owner == 'Effect-TS'
    name: Build ${{ matrix.binary.name }} ${{ matrix.npm_target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        npm_target:
          - darwin-arm64
          - darwin-x64
          - win32-x64
          - win32-arm64
          - linux-x64
          - linux-arm64
          - linux-arm
        binary:
          - name: tsc-next
            profile: next
          - name: tsc
            profile: stable
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          submodules: recursive

      - name: Setup ${{ matrix.binary.profile }} repo
        uses: ./.github/actions/setup-repo
        with:
          profile: ${{ matrix.binary.profile }}

      - name: Build ${{ matrix.binary.name }} ${{ matrix.npm_target }}
        run: pnpm release:prepare --profile ${{ matrix.binary.profile }} --target ${{ matrix.npm_target }} --binary-name ${{ matrix.binary.name }} --skip-cli

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.npm_target }}__${{ matrix.binary.name }}
          path: |
            _packages/tsgo-${{ matrix.npm_target }}/lib/${{ matrix.binary.name }}${{ startsWith(matrix.npm_target, 'win32-') && '.exe' || '' }}

  publish:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'changeset-release/main' &&
      github.repository_owner == 'Effect-TS'
    name: Publish Packages
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download platform binaries
        uses: actions/download-artifact@v8
        with:
          path: _release-artifacts

      - name: Copy binaries into platform packages
        run: |
          for artifact_dir in _release-artifacts/*__*; do
            artifact_name="${artifact_dir##*/}"
            npm_target="${artifact_name%%__*}"
            binary_name="${artifact_name#*__}"
            package_dir="_packages/tsgo-${npm_target}/lib"

            mkdir -p "${package_dir}"
            if [ -f "${artifact_dir}/${binary_name}.exe" ]; then
              cp "${artifact_dir}/${binary_name}.exe" "${package_dir}/${binary_name}.exe"
            else
              cp "${artifact_dir}/${binary_name}" "${package_dir}/${binary_name}"
            fi
          done

      - name: Write platform package metadata
        run: node _tools/upstream.mjs sync-package-metadata

      - name: Build CLI bundle
        run: pnpm build:cli

      - name: Publish packages and create releases
        uses: changesets/action@v1
        with:
          publish: pnpm changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
