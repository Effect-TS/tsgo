name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'changeset-release/main' &&
      github.repository_owner == 'Effect-TS'
    name: Build ${{ matrix.profile }} ${{ matrix.npm_target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: true
      matrix:
        npm_target:
          - darwin-arm64
          - darwin-x64
          - win32-x64
          - win32-arm64
          - linux-x64
          - linux-arm64
          - linux-arm
        profile:
          - next
          - latest
        os:
          - ubuntu-latest
        include:
          - profile: oxlint
            npm_target: darwin-arm64
            os: macos-latest
            rust_target: aarch64-apple-darwin
          - profile: oxlint
            npm_target: darwin-x64
            os: macos-latest
            rust_target: x86_64-apple-darwin
          - profile: oxlint
            npm_target: win32-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - profile: oxlint
            npm_target: win32-arm64
            os: windows-latest
            rust_target: aarch64-pc-windows-msvc
          - profile: oxlint
            npm_target: linux-x64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
          - profile: oxlint
            npm_target: linux-arm64
            os: ubuntu-latest
            rust_target: aarch64-unknown-linux-gnu
    steps:
      - name: Enable long Git paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          submodules: recursive

      - name: Setup Rust
        if: matrix.profile == 'oxlint'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"
          components: rustfmt
          targets: ${{ matrix.rust_target }}

      - name: Setup ${{ matrix.profile }} repo
        uses: ./.github/actions/setup-repo
        with:
          profile: ${{ matrix.profile }}

      - name: Add Oxlint Rust target
        if: matrix.profile == 'oxlint'
        working-directory: oxlint
        run: rustup target add ${{ matrix.rust_target }}

      - name: Build tsc ${{ matrix.profile }} ${{ matrix.npm_target }}
        if: matrix.profile != 'oxlint'
        id: binary
        run: pnpm exec repoctl build binary --profile ${{ matrix.profile }} --target ${{ matrix.npm_target }}

      - name: Build oxlint ${{ matrix.npm_target }}
        if: matrix.profile == 'oxlint'
        id: oxlint
        env:
          TARGET_CC: clang
        run: pnpm exec repoctl build oxlint --target ${{ matrix.npm_target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.npm_target }}__${{ matrix.profile }}
          path: ${{ matrix.profile == 'oxlint' && steps.oxlint.outputs.artifact_path || steps.binary.outputs.binary_path }}

  publish:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'changeset-release/main' &&
      github.repository_owner == 'Effect-TS'
    name: Publish Packages
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download platform binaries
        uses: actions/download-artifact@v8
        with:
          path: _release-artifacts

      - name: Copy binaries into platform packages
        run: |
          for artifact_dir in _release-artifacts/*__*; do
            artifact_name="${artifact_dir##*/}"
            npm_target="${artifact_name%%__*}"
            package_dir="_packages/tsgo-${npm_target}/lib"

            mkdir -p "${package_dir}"
            cp "${artifact_dir}"/* "${package_dir}/"
          done

          for tsgolint in _packages/tsgo-{darwin-*,linux-{x64,arm64}}/lib/tsgolint; do
            chmod 755 "${tsgolint}"
          done

      - name: Bundle upstream metadata
        run: pnpm exec repoctl packages bundle-upstream

      - name: Verify platform binaries
        run: pnpm exec repoctl build verify-release

      - name: Build CLI bundle
        run: pnpm exec repoctl build cli

      - name: Publish packages and create releases
        uses: changesets/action@v1
        with:
          publish: pnpm exec repoctl changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
