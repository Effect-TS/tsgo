name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  select-mode:
    name: Select Mode
    if: github.repository_owner == 'Effect-TS'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select release mode
        id: select-mode
        uses: changesets/action/select-mode@2d9f7af6402422be60d377f151c7618011bba45a # v2.0.0-next.4

  version:
    name: Version Packages
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update release PR
        uses: changesets/action/version@2d9f7af6402422be60d377f151c7618011bba45a # v2.0.0-next.4
        with:
          github-token: ${{ github.token }}
          script: pnpm exec repoctl changeset version

  release-matrix:
    name: Generate Release Matrix
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    uses: ./.github/workflows/repoctl-matrix.yml
    permissions:
      contents: read
    with:
      name: release

  build-release-artifacts:
    name: Build ${{ matrix.component }} ${{ matrix.version }} for ${{ matrix.target }}
    needs: [select-mode, release-matrix]
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ${{ matrix.runner }}
    # The tsrs jobs train PGO (and on Linux BOLT) profiles, as tsrs's own release jobs: repoctl release plan.
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.release-matrix.outputs.matrix) }}
    steps:
      - name: Configure Git for Windows
        if: runner.os == 'Windows'
        run: |
          git config --system core.longpaths true
          git config --system core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Setup ${{ matrix.component }} ${{ matrix.version }}
        uses: ./.github/actions/setup-repo
        with:
          component: ${{ matrix.component }}
          version: ${{ matrix.version }}
          target: ${{ matrix.target }}

      - name: Build release artifact
        if: matrix.component != 'tsrs'
        id: build
        env:
          TARGET_CC: clang
        run: >
          pnpm exec repoctl build artifact
          --component "${{ matrix.component }}"
          --version "${{ matrix.version }}"
          --target "${{ matrix.target }}"

      # BOLT from the LLVM release that matches rustc's LLVM, which rust-toolchain.toml pins (tsrsRelease.ts).
      - name: Cache BOLT
        if: matrix.component == 'tsrs' && matrix.optimize == 'pgo-bolt'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tsrs-release/llvm
          key: release-bolt-v1-${{ matrix.runner }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}

      # tsrs's release pipeline (PGO, plus BOLT on Linux; tsrsRelease.ts): the C code (mimalloc) is built with the
      # runner's default compiler, as there.
      - name: Build tsrs release artifact
        if: matrix.component == 'tsrs'
        id: build-tsrs
        run: >
          pnpm exec repoctl build artifact
          --component tsrs
          --version "${{ matrix.version }}"
          --target "${{ matrix.target }}"
          --optimize "${{ matrix.optimize }}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifactName }}
          path: ${{ steps.build.outputs.artifact_path || steps.build-tsrs.outputs.artifact_path }}
          if-no-files-found: error

  pack:
    name: Pack Packages
    needs: [select-mode, build-release-artifacts]
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download platform binaries
        uses: actions/download-artifact@v8
        with:
          pattern: "*__*"
          path: _release-artifacts

      - name: Assemble platform packages
        run: pnpm exec repoctl packages assemble --artifacts _release-artifacts

      - name: Prepare platform packages
        run: pnpm exec repoctl packages prepare

      - name: Verify platform binaries
        run: pnpm exec repoctl build verify-release

      - name: Build CLI bundle
        run: pnpm exec repoctl build cli

      - name: Pack packages
        id: pack
        uses: changesets/action/pack@2d9f7af6402422be60d377f151c7618011bba45a # v2.0.0-next.4
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish Packages
    needs: [select-mode, pack]
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish packages and create releases
        uses: changesets/action/publish@2d9f7af6402422be60d377f151c7618011bba45a # v2.0.0-next.4
        with:
          github-token: ${{ github.token }}
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          push-git-tags: true
          create-github-releases: true
        env:
          NPM_CONFIG_PROVENANCE: "true"
