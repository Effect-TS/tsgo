name: Update TypeScript-Go

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: update-typescript-go-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  update:
    name: Update upstream profiles
    if: github.repository_owner == 'Effect-TS'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
      pr_number: ${{ steps.cpr.outputs.pull-request-number }}
      head_sha: ${{ steps.cpr.outputs.pull-request-head-sha }}
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Track TypeScript-Go submodule updates in Git
        run: git config submodule.typescript-go.ignore dirty

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Record current TypeScript-Go commit
        id: before
        run: echo "sha=$(git -C typescript-go rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve TypeScript next metadata
        id: next
        env:
          TYPESCRIPT_SPEC: typescript@next
        run: |
          metadata="$(npm view "${TYPESCRIPT_SPEC}" version gitHead --json)"
          version="$(node -e 'const m = JSON.parse(process.argv[1]); if (!m.version) process.exit(1); process.stdout.write(m.version)' "$metadata")"
          git_head="$(node -e 'const m = JSON.parse(process.argv[1]); if (!/^[0-9a-f]{40}$/.test(m.gitHead || "")) process.exit(1); process.stdout.write(m.gitHead)' "$metadata")"

          echo "spec=${TYPESCRIPT_SPEC}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "git_head=${git_head}" >> "$GITHUB_OUTPUT"

      - name: Resolve TypeScript stable metadata
        id: stable
        env:
          TYPESCRIPT_SPEC: typescript@latest
        run: |
          metadata="$(npm view "${TYPESCRIPT_SPEC}" version gitHead --json)"
          version="$(node -e 'const m = JSON.parse(process.argv[1]); if (!m.version) process.exit(1); process.stdout.write(m.version)' "$metadata")"
          git_head="$(node -e 'const m = JSON.parse(process.argv[1]); if (!/^[0-9a-f]{40}$/.test(m.gitHead || "")) process.exit(1); process.stdout.write(m.gitHead)' "$metadata")"

          echo "spec=${TYPESCRIPT_SPEC}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "git_head=${git_head}" >> "$GITHUB_OUTPUT"

      - name: Update upstream profiles
        run: |
          node _tools/upstream.mjs set-typescript next \
            "${{ steps.next.outputs.version }}" \
            "${{ steps.next.outputs.git_head }}"
          node _tools/upstream.mjs set-typescript stable \
            "${{ steps.stable.outputs.version }}" \
            "${{ steps.stable.outputs.git_head }}"

      - name: Setup next repo
        uses: ./.github/actions/setup-repo
        with:
          profile: next

      - name: Record updated TypeScript-Go commit
        id: after
        run: echo "sha=$(git -C typescript-go rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stage TypeScript-Go metadata
        run: git add typescript-go _packages/tsgo/upstream.json

      - name: Build upstream changelog
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before="${{ steps.before.outputs.sha }}"
          after="${{ steps.after.outputs.sha }}"
          compare_url="https://github.com/microsoft/typescript-go/compare/${before}...${after}"
          commits="$(gh api \
            repos/microsoft/typescript-go/compare/${before}...${after} \
            --jq '.commits[] | "- [\(.sha[0:7])](https://github.com/microsoft/typescript-go/commit/\(.sha)) \(.commit.message | split("\n")[0])"')"

          {
            echo "compare_url=${compare_url}"
            echo "commits<<EOF"
            printf '%s\n' "$commits"
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: changes
        run: |
          if [ "${{ steps.before.outputs.sha }}" != "${{ steps.after.outputs.sha }}" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --cached --quiet && git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Write changeset
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          cat > .changeset/update-typescript-go.md <<EOF
          ---
          "@effect/tsgo": patch
          ---

          Update the next profile to \
          [\`${{ steps.next.outputs.spec }}\`](https://www.npmjs.com/package/typescript/v/${{ steps.next.outputs.version }}), \
          which ships \
          [\`typescript-go\`](https://github.com/microsoft/typescript-go/commit/${{ steps.after.outputs.sha }}) \
          commit \`${{ steps.after.outputs.sha }}\`, and update the stable profile to \
          [\`${{ steps.stable.outputs.spec }}\`](https://www.npmjs.com/package/typescript/v/${{ steps.stable.outputs.version }}).
          EOF

      - name: Create Pull Request
        id: cpr
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-typescript-go
          delete-branch: true
          commit-message: "chore: update typescript-go"
          title: "chore: update typescript-go"
          body: |
            Automated update of the `typescript-go` submodule and regenerated shim/codegen output.

            ## TypeScript-Go

            - TypeScript package: `${{ steps.next.outputs.spec }}`
            - TypeScript version: `${{ steps.next.outputs.version }}`
            - Previous commit: `${{ steps.before.outputs.sha }}`
            - Updated commit: `${{ steps.after.outputs.sha }}`
            - Compare: ${{ steps.changelog.outputs.compare_url }}

            ## Stable profile

            - TypeScript package: `${{ steps.stable.outputs.spec }}`
            - TypeScript version: `${{ steps.stable.outputs.version }}`
            - TypeScript-Go commit: `${{ steps.stable.outputs.git_head }}`

            ## Upstream commits

            ${{ steps.changelog.outputs.commits }}

            ---

            *This PR was automatically generated by the TypeScript-Go update workflow.*
          labels: automated

  refresh-flake-hash:
    name: Refresh flake hash
    needs: update
    if: needs.update.outputs.has_changes == 'true' && needs.update.outputs.head_sha != ''
    permissions:
      contents: write
    uses: ./.github/workflows/refresh-flake-hash.yml
    with:
      target_ref: chore/update-typescript-go
    secrets: inherit

  validate-profiles:
    name: Validate ${{ matrix.profile }} profile
    needs:
      - update
      - refresh-flake-hash
    if: needs.update.outputs.has_changes == 'true' && needs.refresh-flake-hash.outputs.head_sha != ''
    strategy:
      fail-fast: false
      matrix:
        profile:
          - next
          - stable
    permissions:
      contents: read
    uses: ./.github/workflows/validate-profile.yml
    with:
      head_sha: ${{ needs.refresh-flake-hash.outputs.head_sha }}
      profile: ${{ matrix.profile }}
    secrets: inherit

  publish-validation:
    name: Publish profile validation
    needs:
      - refresh-flake-hash
      - validate-profiles
    if: needs.validate-profiles.result == 'success' && needs.refresh-flake-hash.outputs.head_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
      contents: read
    steps:
      - name: Verify bot branch head
        env:
          EXPECTED_SHA: ${{ needs.refresh-flake-hash.outputs.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          actual_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/chore/update-typescript-go" --jq '.object.sha')"
          if [ "${actual_sha}" != "${EXPECTED_SHA}" ]; then
            echo "Bot branch moved from ${EXPECTED_SHA} to ${actual_sha}; refusing to publish stale validation" >&2
            exit 1
          fi

      - name: Publish validation check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ needs.refresh-flake-hash.outputs.head_sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name='Upstream profile validation' \
            -f head_sha="${HEAD_SHA}" \
            -f status=completed \
            -f conclusion=success \
            -f 'output[title]=Upstream profiles passed validation' \
            -f 'output[summary]=The final bot PR head passed next and stable profile validation.'
