[package]
name = "ets_effecttest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Port of internal/effecttest: the baseline runner shared with the Go tests"

[lints]
workspace = true

[dependencies]
ets_bundledeffect.workspace = true
ets_etscheckerhooks.workspace = true
# Go reaches `etscore.EffectPluginOptions` through the shim's `core.CompilerOptions.Effect` field.
ets_etscore.workspace = true
ets_etslshooks.workspace = true
ets_etstesthooks.workspace = true
ets_fourslash.workspace = true
ets_go.workspace = true
ets_layergraph.workspace = true
ets_readonly.workspace = true
ets_shim.workspace = true
ets_typeparser.workspace = true
parking_lot.workspace = true
regex.workspace = true
rustc-hash.workspace = true
similar.workspace = true

[dev-dependencies]
flate2.workspace = true
libtest-mimic.workspace = true

# The Go tests of internal/effecttest run one subtest per case of testdata/tests/<suite>; a custom harness gives each
# case its own libtest trial, so `cargo test -p ets_effecttest -- <case>` filters cases.
[[test]]
name = "effecttest"
path = "tests/effecttest/main.rs"
harness = false
