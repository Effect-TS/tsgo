[workspace]
resolver = "3"
members = ["crates/*"]
# tsrs/ (the patched checkout set up by `pnpm setup-repo`) is a Cargo workspace of its own. Its crates are reached
# through the generated crates/ets_shim only (path dependencies into tsrs/crates, so every tsrs type unifies).
exclude = ["tsrs"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
# The tsrs facade (generated by _tools/gen_shims/rustshim; never depend on a tsrs_* crate directly).
ets_shim = { path = "crates/ets_shim" }

# Workspace crates.
ets_autoimportstyle = { path = "crates/ets_autoimportstyle" }
ets_bundledeffect = { path = "crates/ets_bundledeffect" }
ets_codegen = { path = "crates/ets_codegen" }
ets_codegens = { path = "crates/ets_codegens" }
ets_completion = { path = "crates/ets_completion" }
ets_completions = { path = "crates/ets_completions" }
ets_directives = { path = "crates/ets_directives" }
ets_effectconfigcheck = { path = "crates/ets_effectconfigcheck" }
ets_effectconfigraw = { path = "crates/ets_effectconfigraw" }
ets_effecttest = { path = "crates/ets_effecttest" }
ets_etscheckerhooks = { path = "crates/ets_etscheckerhooks" }
ets_etscore = { path = "crates/ets_etscore" }
ets_etsdiagnostics = { path = "crates/ets_etsdiagnostics" }
ets_etsexecutehooks = { path = "crates/ets_etsexecutehooks" }
ets_etsgoapi = { path = "crates/ets_etsgoapi" }
ets_etslshooks = { path = "crates/ets_etslshooks" }
ets_etstesthooks = { path = "crates/ets_etstesthooks" }
ets_fixable = { path = "crates/ets_fixable" }
ets_fixables = { path = "crates/ets_fixables" }
ets_fourslash = { path = "crates/ets_fourslash" }
ets_go = { path = "crates/ets_go" }
ets_graph = { path = "crates/ets_graph" }
ets_importstyle = { path = "crates/ets_importstyle" }
ets_keybuilder = { path = "crates/ets_keybuilder" }
ets_layergraph = { path = "crates/ets_layergraph" }
ets_pluginoptions = { path = "crates/ets_pluginoptions" }
ets_readonly = { path = "crates/ets_readonly" }
ets_refactor = { path = "crates/ets_refactor" }
ets_refactors = { path = "crates/ets_refactors" }
ets_rewriter = { path = "crates/ets_rewriter" }
ets_rule = { path = "crates/ets_rule" }
ets_rulerunner = { path = "crates/ets_rulerunner" }
ets_rules = { path = "crates/ets_rules" }
ets_schemagen = { path = "crates/ets_schemagen" }
ets_typeparser = { path = "crates/ets_typeparser" }

# Libraries.
flate2 = "1"
libtest-mimic = "0.8"
parking_lot = "0.12"
regex = "1"
rustc-hash = "2"
serde_json = "1"
sha2 = "0.10"
similar = "3"
tar = "0.4"

[workspace.lints.rust]
non_upper_case_globals = "allow"
non_camel_case_types = "allow"
# Rust 1.99: forming raw pointers through intermediate references can strengthen aliasing assumptions accidentally.
raw_borrows_via_references = "warn"

[workspace.lints.clippy]
# Keep the baseline aligned with oxc-project/oxc (and tsrs). Deny every enabled Clippy lint directly.
all = { level = "deny", priority = -2 }
pedantic = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }

# Oxc's global allowlist: noisy, chaotic or unsuitable for a non-const compiler implementation.
struct_excessive_bools = "allow"
too_many_lines = "allow"
must_use_candidate = "allow"
wildcard_imports = "allow"
similar_names = "allow"
too_many_arguments = "allow"
missing_const_for_fn = "allow"
option_if_let_else = "allow"
or_fun_call = "allow"
use_self = "allow"
significant_drop_tightening = "allow"
branches_sharing_code = "allow"
useless_let_if_seq = "allow"

# Exceptions (inherited from tsrs) to Oxc's policy. This workspace is a mechanical Go port: visibility,
# signatures, numeric conversions, declaration placement and control-flow decomposition follow the Go source.
redundant_pub_crate = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
collapsible_if = "allow"
if_not_else = "allow"
type_complexity = "allow"
match_same_arms = "allow"
items_after_statements = "allow"
struct_field_names = "allow"
many_single_char_names = "allow"

# Oxc restriction and nursery additions.
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
fn_to_numeric_cast_any = "deny"
unnecessary_self_imports = "deny"
try_err = "deny"
error_impl_error = "deny"
filetype_is_file = "deny"
get_unwrap = "deny"
rest_pat_in_fully_bound_structs = "deny"
unnecessary_safety_comment = "deny"
infinite_loop = "deny"
map_with_unused_argument_over_ranges = "deny"
unused_result_ok = "deny"
pathbuf_init_then_push = "deny"
pub_underscore_fields = "deny"
non_zero_suggestions = "deny"
precedence_bits = "deny"
iter_on_single_items = "deny"
unused_peekable = "deny"
suspicious_operation_groupings = "deny"
return_and_then = "deny"

# A `.clone()` that remains is a real copy.
redundant_clone = "deny"
clone_on_copy = "deny"
implicit_clone = "deny"
clone_on_ref_ptr = "deny"
assigning_clones = "deny"
cloned_instead_of_copied = "deny"

[profile.dev]
# As tsrs (its notes/dev-loop-build.md): the checker is unusably slow unoptimized.
opt-level = 3
incremental = true
# Keeps file:line in backtraces at a fraction of the disk of full debuginfo (one target/ per worktree).
debug = "line-tables-only"

[profile.release]
# Same as tsrs's release profile (tsrs/Cargo.toml); keep in sync on tsrs bumps.
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
panic = "unwind"
