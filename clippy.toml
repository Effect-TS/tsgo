# Configuration for the lints enabled in Cargo.toml ([workspace.lints.clippy]); tsrs's clippy.toml, minus its
# crate-internal entries.

# The workspace crates are not published; without this the argument-passing lints skip every `pub fn`.
avoid-breaking-exported-api = false

# Keys whose Hash and Eq use the pointer, not the contents, so interior mutability cannot change the hash.
ignore-interior-mutability = ["tsrs_core::ptr::P", "tsrs_core::ptr::SP"]

disallowed-types = [
  { path = "std::collections::HashMap", reason = "SipHash; use rustc_hash::FxHashMap, or tsrs_core::collections::OrderedMap when order matters" },
  { path = "std::collections::HashSet", reason = "SipHash; use rustc_hash::FxHashSet, or tsrs_core::collections::OrderedSet when order matters" },
]

# Unchecked operations trade a panic for undefined behavior. Each use needs
# `#[expect(clippy::disallowed_methods, reason = "<the measurement that justifies it>")]`.
disallowed-methods = [
  { path = "slice::get_unchecked", reason = "keep the bounds check unless a measurement shows its cost" },
  { path = "slice::get_unchecked_mut", reason = "keep the bounds check unless a measurement shows its cost" },
  { path = "str::get_unchecked", reason = "keep the bounds check unless a measurement shows its cost" },
  { path = "core::hint::unreachable_unchecked", reason = "use unreachable!() unless a measurement shows its cost" },
  { path = "core::option::Option::unwrap_unchecked", reason = "use unwrap()/expect() unless a measurement shows its cost" },
  { path = "core::result::Result::unwrap_unchecked", reason = "use unwrap()/expect() unless a measurement shows its cost" },
  { path = "core::str::from_utf8_unchecked", reason = "use from_utf8 unless a measurement shows its cost" },
]

disallowed-macros = [
  { path = "std::dbg", reason = "debugging leftover" },
]
